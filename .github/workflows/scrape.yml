name: Hourly card scrape

on:
  schedule:
    - cron: "0 * * * *" # top of every hour, UTC
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - run: npm ci
      - run: npm test

      - name: Write Firebase service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > serviceAccountKey.json
        env:
          # Reuses the secret Firebase's own `hosting:github` setup already created
          # (same service account, just named after the project id).
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARD_FINDER_9C1D9 }}

      - run: npm run scrape
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          FIREBASE_SERVICE_ACCOUNT_PATH: ./serviceAccountKey.json
